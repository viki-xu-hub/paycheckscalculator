<svg xmlns="http://www.w3.org/2000/svg" width="880" height="296" viewBox="0 0 880 296" role="img" aria-labelledby="t d">
  <title id="t">Where a $2,000 biweekly hourly paycheck goes after withholding</title>
  <desc id="d">Of $2,000 gross, $1,690.85 is take-home, $156.15 federal income tax, $124 Social Security and $29 Medicare.</desc>
  <style>
    .h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}
    .s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .n{font:700 15px Arial,Helvetica,sans-serif;fill:#1c2333}
    .m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .box{fill:#fff;stroke:#e4e7ec;stroke-width:1.5}
    .grid{stroke:#e4e7ec;stroke-width:1}
  </style>
  <rect width="880" height="296" fill="#f7f8fa" rx="12"/>
  <text x="440" y="40" text-anchor="middle" class="h">Where a $2,000 biweekly paycheck goes ($25/hour, 40 hours, Texas, single filer)</text>
  <text x="440" y="66" text-anchor="middle" class="s">Hourly paycheck calculator breakdown of gross pay: take-home plus each withholding line, 2026 rates</text>
  <rect x="60.0" y="110" width="640.5" height="46" fill="#4a63e7" rx="4"/>
  <rect x="702.5" y="110" width="57.3" height="46" fill="#c9741a"/>
  <rect x="761.9" y="110" width="45.1" height="46" fill="#149c86"/>
  <rect x="809.0" y="110" width="11.0" height="46" fill="#8a4fd6" rx="4"/>
  <text x="381" y="138.0" text-anchor="middle" style="font:700 15px Arial,Helvetica,sans-serif;fill:#fff">84.5% take-home</text>
  <rect x="60" y="189" width="12" height="12" rx="3" fill="#4a63e7"/>
  <text x="78" y="200" class="m">Take-home</text>
  <text x="78" y="220" class="n">$1,690.85 · 84.5%</text>
  <rect x="255" y="189" width="12" height="12" rx="3" fill="#c9741a"/>
  <text x="273" y="200" class="m">Federal income tax</text>
  <text x="273" y="220" class="n">$156.15 · 7.8%</text>
  <rect x="450" y="189" width="12" height="12" rx="3" fill="#149c86"/>
  <text x="468" y="200" class="m">Social Security 6.2%</text>
  <text x="468" y="220" class="n">$124.00 · 6.2%</text>
  <rect x="645" y="189" width="12" height="12" rx="3" fill="#8a4fd6"/>
  <text x="663" y="200" class="m">Medicare 1.45%</text>
  <text x="663" y="220" class="n">$29.00 · 1.5%</text>
  <text x="60" y="256" class="m">No state income tax in this example — in a state with income tax a fifth segment appears.</text>
  <text x="60" y="276" class="m">401(k) and pre-tax benefits shrink the taxable base before these lines are computed.</text>
</svg>
