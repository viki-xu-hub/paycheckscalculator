<title id="t">How many pay periods in a year by pay schedule</title>
<desc id="d">Weekly: 52 pay periods, $1,153.85 gross per check on $60,000. Biweekly: 26 pay periods, $2,307.69 gross per check on $60,000. Semimonthly: 24 pay periods, $2,500.00 gross per check on $60,000. Monthly: 12 pay periods, $5,000.00 gross per check on $60,000</desc>
