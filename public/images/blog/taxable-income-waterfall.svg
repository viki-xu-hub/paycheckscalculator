<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
<title id="t">From salary to taxable income</title>
<desc id="d">$60,000 salary minus $4,800 of pre-tax 401(k) and health premiums, plus $400 interest, minus the $16,100 2026 standard deduction leaves $39,500 of taxable income.</desc>
<rect width="960" height="440" rx="16" fill="#f6f9fc"/>
<text x="32" y="44" text-anchor="start" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#122a3d">What Is Taxable Income? From $60,000 Salary to Line 15</text>
<text x="32" y="70" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#5f7485">Single filer, 2026 · IRS Rev. Proc. 2025-32 standard deduction</text>
<rect x="90" y="100.0" width="110" height="230.0" rx="5" fill="#8fb8de"/>
<text x="145" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#122a3d">$60,000</text>
<text x="145" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d5466">Salary</text>
<rect x="258" y="100.0" width="110" height="18.4" rx="5" fill="#e07a5f"/>
<text x="313" y="92" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#122a3d">−$4,800</text>
<text x="313" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d5466">401(k) + health</text>
<rect x="426" y="116.9" width="110" height="2.0" rx="5" fill="#81b29a"/>
<text x="481" y="108.86666666666667" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#122a3d">+$400</text>
<text x="481" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d5466">+ Interest</text>
<rect x="594" y="116.9" width="110" height="61.7" rx="5" fill="#e07a5f"/>
<text x="649" y="108.86666666666667" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#122a3d">−$16,100</text>
<text x="649" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d5466">Standard deduction</text>
<rect x="762" y="178.6" width="110" height="151.4" rx="5" fill="#1769aa"/>
<text x="817" y="170.58333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#122a3d">$39,500</text>
<text x="817" y="352" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#3d5466">Taxable income</text>
<text x="32" y="426" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#8595a5">paycheckscalculator.org · 2026 standard deduction and brackets, IRS Rev. Proc. 2025-32</text>
</svg>