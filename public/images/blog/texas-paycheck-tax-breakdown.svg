<title id="t">Texas biweekly paycheck tax breakdown at four salaries</title>
<desc id="d">$40,000 salary: $1,538.46 gross, $100.77 federal, $95.38 Social Security, $22.31 Medicare, $1,320.00 take-home. $60,000 salary: $2,307.69 gross, $193.08 federal, $143.08 Social Security, $33.46 Medicare, $1,938.08 take-home. $75,000 salary: $2,884.62 gross, $295.00 federal, $178.85 Social Security, $41.83 Medicare, $2,368.94 take-home. $100,000 salary: $3,846.15 gross, $506.54 federal, $238.46 Social Security, $55.77 Medicare, $3,045.38 take-home. Single filer, no Texas income tax.</desc>
