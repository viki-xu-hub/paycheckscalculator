<text x="76" y="242" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">Social Security (OASDI)</text>
<text x="490" y="242" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">−$143.08</text>
<line x1="510" x2="548" y1="237" y2="237" stroke="#b7c6d3" stroke-dasharray="3 3"/>
<text x="556" y="242" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#3d5466">③ 6.2% of gross</text>
