<text x="490" y="166" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#122a3d">$2,307.69</text>
<line x1="510" x2="548" y1="161" y2="161" stroke="#b7c6d3" stroke-dasharray="3 3"/>
<text x="556" y="166" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#3d5466">① $60,000 ÷ 26 pay periods</text>
<rect x="60" y="190" width="6" height="18" rx="2" fill="#e07a5f"/>
<text x="76" y="204" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">Federal income tax</text>
<text x="490" y="204" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">−$193.08</text>
