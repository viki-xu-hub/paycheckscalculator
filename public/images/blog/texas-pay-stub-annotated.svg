<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
<title id="t">Annotated Texas biweekly pay stub for a $60,000 salary</title>
<desc id="d">A $60,000 single filer in Texas: $2,307.69 gross, $193.08 federal income tax, $143.08 Social Security, $33.46 Medicare, $0 Texas income tax, $1,938.08 net pay.</desc>
<rect width="960" height="440" rx="16" fill="#f6f9fc"/>
<text x="32" y="44" text-anchor="start" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#122a3d">Reading a Texas Pay Stub, Line by Line</text>
<text x="32" y="70" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#5f7485">$60,000 salary · single · biweekly · 2026 W-4 with no adjustments</text>
<rect x="40" y="92" width="470" height="300" rx="10" fill="#fff" stroke="#c9d6e2"/>
<text x="60" y="122" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#5f7485">EARNINGS STATEMENT · Biweekly</text>
<text x="490" y="122" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#5f7485">Pay date 11/06/2026</text>
