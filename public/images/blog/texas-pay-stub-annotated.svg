<text x="490" y="356" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#122a3d">$1,938.08</text>
<line x1="510" x2="548" y1="351" y2="351" stroke="#b7c6d3" stroke-dasharray="3 3"/>
<text x="556" y="356" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#3d5466">⑥ Gross minus ②③④</text>
<text x="32" y="426" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#8595a5">paycheckscalculator.org · 2026 IRS Pub 15-T withholding, 6.2% Social Security, 1.45% Medicare</text>
