<text x="76" y="280" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">Medicare</text>
<text x="490" y="280" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">−$33.46</text>
<line x1="510" x2="548" y1="275" y2="275" stroke="#b7c6d3" stroke-dasharray="3 3"/>
<text x="556" y="280" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#3d5466">④ 1.45% of gross</text>
<rect x="60" y="304" width="6" height="18" rx="2" fill="#81b29a"/>
<text x="76" y="318" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">Texas state income tax</text>
<text x="490" y="318" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#122a3d">$0.00</text>
<line x1="510" x2="548" y1="313" y2="313" stroke="#b7c6d3" stroke-dasharray="3 3"/>
<text x="556" y="318" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#3d5466">⑤ Texas has no wage income tax</text>
<line x1="60" x2="490" y1="334" y2="334" stroke="#122a3d"/>
<rect x="60" y="342" width="6" height="18" rx="2" fill="#1769aa"/>
