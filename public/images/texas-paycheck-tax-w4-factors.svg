<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="t d">
  <title id="t">What changes how much federal tax is deducted from a Texas paycheck</title>
  <desc id="d">Filing status, dependents, extra withholding on Form W-4 and pre-tax contributions all change Texas paycheck withholding.</desc>
  <style>
    .box{fill:#fff;stroke:#e4e7ec;stroke-width:1.5}
    .accent{fill:#4a63e7}
    .h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}
    .s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .n{font:700 22px Arial,Helvetica,sans-serif;fill:#1c2333}
    .v{font:700 14px Arial,Helvetica,sans-serif;fill:#1c2333}
    .w{font:700 15px Arial,Helvetica,sans-serif;fill:#fff}
    .arrow{stroke:#9aa3b2;stroke-width:2;fill:none;marker-end:url(#m)}
    .grid{stroke:#e4e7ec;stroke-width:1}
  </style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa3b2"/></marker></defs>
  <rect width="880" height="340" fill="#f7f8fa" rx="12"/>
  <text x="440" y="40" text-anchor="middle" class="h">Six inputs that change how much tax is deducted from your Texas paycheck</text>
  <text x="440" y="66" text-anchor="middle" class="s">Texas has no state withholding form, so Form W-4 alone controls the tax line on your pay stub.</text>
  <rect x="30" y="92" width="267" height="96" rx="10" class="box"/>
  <circle cx="56" cy="122" r="13" fill="#4a63e7"/>
  <text x="56" y="127" text-anchor="middle" class="w" style="font-size:13px">1</text>
  <text x="78" y="127" class="v">Filing status</text>
  <text x="50" y="150" class="m">Married filing jointly withholds</text>
  <text x="50" y="167" class="m">less than single at the same pay</text>
  <rect x="317" y="92" width="267" height="96" rx="10" class="box"/>
  <circle cx="343" cy="122" r="13" fill="#4a63e7"/>
  <text x="343" y="127" text-anchor="middle" class="w" style="font-size:13px">2</text>
  <text x="365" y="127" class="v">Step 3 dependents</text>
  <text x="337" y="150" class="m">$2,200 per qualifying child cuts</text>
  <text x="337" y="167" class="m">withholding by about $84.62 a check</text>
  <rect x="604" y="92" width="267" height="96" rx="10" class="box"/>
  <circle cx="630" cy="122" r="13" fill="#4a63e7"/>
  <text x="630" y="127" text-anchor="middle" class="w" style="font-size:13px">3</text>
  <text x="652" y="127" class="v">Step 4(a) other income</text>
  <text x="624" y="150" class="m">Interest, dividends or side income</text>
  <text x="624" y="167" class="m">raise federal withholding</text>
  <rect x="30" y="204" width="267" height="96" rx="10" class="box"/>
  <circle cx="56" cy="234" r="13" fill="#4a63e7"/>
  <text x="56" y="239" text-anchor="middle" class="w" style="font-size:13px">4</text>
  <text x="78" y="239" class="v">Step 4(b) deductions</text>
  <text x="50" y="262" class="m">Itemized deductions above the</text>
  <text x="50" y="279" class="m">standard amount lower withholding</text>
  <rect x="317" y="204" width="267" height="96" rx="10" class="box"/>
  <circle cx="343" cy="234" r="13" fill="#4a63e7"/>
  <text x="343" y="239" text-anchor="middle" class="w" style="font-size:13px">5</text>
  <text x="365" y="239" class="v">Step 4(c) extra amount</text>
  <text x="337" y="262" class="m">A flat dollar add-on taken from</text>
  <text x="337" y="279" class="m">every single paycheck</text>
  <rect x="604" y="204" width="267" height="96" rx="10" class="box"/>
  <circle cx="630" cy="234" r="13" fill="#4a63e7"/>
  <text x="630" y="239" text-anchor="middle" class="w" style="font-size:13px">6</text>
  <text x="652" y="239" class="v">Pre-tax 401(k) / HSA</text>
  <text x="624" y="262" class="m">Cuts taxable wages, so less federal</text>
  <text x="624" y="279" class="m">income tax is deducted</text>
  <text x="440" y="326" text-anchor="middle" class="m">Update Form W-4 with your employer whenever pay, marital status or dependents change.</text>
</svg>