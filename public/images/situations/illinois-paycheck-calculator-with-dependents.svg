<title id="t">Illinois bi-weekly take-home pay by number of children</title>
<desc id="d">Illinois paycheck calculator with dependents example: on a $75,000 salary, bi-weekly take-home pay rises from $2,354 with no children to $2,444 with one child and $2,534 with two.</desc>
