<text x="313" y="130.9" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#122a3d">$2,500</text>
<text x="313" y="332" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#3d5466">1 child</text>
