<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="t d">
  <title id="t">How Publication 505 worksheets feed the 2026 Estimated Tax Worksheet</title>
  <desc id="d">Worksheet 2-2 feeds line 1, Worksheet 2-3 feeds lines 1 and 9, Worksheets 2-4 to 2-6 feed line 2a, and Worksheets 2-7 and 2-8 feed line 4 of the Estimated Tax Worksheet, which produces the quarterly payment on line 15.</desc>
  <style>.h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}.s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}.cap{font:700 13px Arial,Helvetica,sans-serif;fill:#1c2333}.m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}.w{font:700 13px Arial,Helvetica,sans-serif;fill:#fff}.b{fill:#fff;stroke:#c9d3dd}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa7b4"/></marker></defs>
  <rect width="880" height="380" fill="#f7f8fa" rx="12"/>
  <text x="440" y="36" text-anchor="middle" class="h">Publication 505: supporting worksheets feed one main worksheet</text>
  <text x="440" y="59" text-anchor="middle" class="s">Use only the ones that match your income</text>
  <rect x="40" y="88" width="300" height="44" class="b" rx="7"/><text x="190" y="115" text-anchor="middle" class="cap">2-2 Social Security benefits → line 1</text>
  <rect x="40" y="148" width="300" height="44" class="b" rx="7"/><text x="190" y="175" text-anchor="middle" class="cap">2-3 Self-employment tax → lines 1, 9</text>
  <rect x="40" y="208" width="300" height="44" class="b" rx="7"/><text x="190" y="235" text-anchor="middle" class="cap">2-4 to 2-6 Deductions → line 2a</text>
  <rect x="40" y="268" width="300" height="44" class="b" rx="7"/><text x="190" y="295" text-anchor="middle" class="cap">2-7 / 2-8 Dividends, gains → line 4</text>
  <rect x="440" y="150" width="200" height="104" fill="#3d5af1" rx="8"/>
  <text x="540" y="192" text-anchor="middle" class="w">2026 Estimated</text>
  <text x="540" y="212" text-anchor="middle" class="w">Tax Worksheet</text>
  <text x="540" y="232" text-anchor="middle" class="w" style="font-weight:400;font-size:11.5px">Form 1040-ES</text>
  <line x1="340" y1="110" x2="438" y2="170" stroke="#9aa7b4" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="170" x2="438" y2="190" stroke="#9aa7b4" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="230" x2="438" y2="214" stroke="#9aa7b4" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="290" x2="438" y2="236" stroke="#9aa7b4" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="202" x2="698" y2="202" stroke="#9aa7b4" stroke-width="2" marker-end="url(#a)"/>
  <rect x="700" y="166" width="150" height="72" fill="#149c86" rx="8"/>
  <text x="775" y="198" text-anchor="middle" class="w">Line 15</text>
  <text x="775" y="217" text-anchor="middle" class="w" style="font-weight:400;font-size:11.5px">quarterly payment</text>
  <text x="440" y="348" text-anchor="middle" class="m">Worksheet 2-9 replaces the even split when income arrives unevenly (annualized method)</text>
</svg>
