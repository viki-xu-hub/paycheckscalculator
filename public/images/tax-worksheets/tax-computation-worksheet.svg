<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="t d">
  <title id="t">How the 2026 Tax Computation Worksheet works for a single filer with $150,000 of taxable income</title>
  <desc id="d">Multiplying all $150,000 by the 24% rate gives $36,000. The $7,402 subtraction amount removes the over-charge on income in lower brackets, leaving tax of $28,598.</desc>
  <style>.h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}.s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}.cap{font:700 13px Arial,Helvetica,sans-serif;fill:#1c2333}.m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}.w{font:700 13px Arial,Helvetica,sans-serif;fill:#fff}.b{fill:#fff;stroke:#c9d3dd}</style>
  <rect width="880" height="380" fill="#f7f8fa" rx="12"/>
  <text x="440" y="36" text-anchor="middle" class="h">One multiplication, one subtraction — single filer, $150,000, 2026</text>
  <text x="440" y="59" text-anchor="middle" class="s">Column (d) is the over-charge from taxing every dollar at the top bracket rate</text>
  <text x="90" y="112" class="cap">(c) $150,000 × 0.24</text>
  <rect x="90" y="124" width="700" height="52" fill="#9aa7b4" rx="4"/>
  <text x="440" y="156" text-anchor="middle" class="w">$36,000 if every dollar were taxed at 24%</text>
  <text x="90" y="222" class="cap">Tax = (c) − (d)</text>
  <rect x="90" y="234" width="556" height="52" fill="#3d5af1" rx="4"/>
  <text x="368" y="266" text-anchor="middle" class="w">Tax $28,598</text>
  <rect x="646" y="234" width="144" height="52" fill="#c9741a" rx="4"/>
  <text x="718" y="258" text-anchor="middle" class="w">(d) $7,402</text>
  <text x="718" y="275" text-anchor="middle" class="w" style="font-weight:400;font-size:11.5px">subtracted</text>
  <text x="440" y="330" text-anchor="middle" class="m">Same answer as taxing $12,400 at 10%, $38,000 at 12%, $55,300 at 22% and $44,300 at 24%</text>
</svg>
