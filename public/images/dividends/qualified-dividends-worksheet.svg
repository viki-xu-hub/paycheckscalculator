<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-labelledby="t d">
  <title id="t">How the Qualified Dividends and Capital Gain Tax Worksheet stacks income in 2026</title>
  <desc id="d">Ordinary income fills the 0% band from the bottom. Qualified dividends and long-term capital gain stack on top and are taxed at 0% only in whatever room is left, then 15%, then 20% above the upper threshold.</desc>
  <style>
    .h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}
    .s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .cap{font:700 13px Arial,Helvetica,sans-serif;fill:#1c2333}
    .m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .w{font:700 13px Arial,Helvetica,sans-serif;fill:#fff}
    .th{font:700 11.5px Arial,Helvetica,sans-serif;fill:#5f6b7a}
  </style>
  <rect width="880" height="380" fill="#f7f8fa" rx="12"/>
  <text x="440" y="36" text-anchor="middle" class="h">How the worksheet stacks income — single filer, 2026</text>
  <text x="440" y="59" text-anchor="middle" class="s">Ordinary income fills the 0% band first; preferential income sits on top of it</text>

  <text x="150" y="92" text-anchor="middle" class="cap">Case A — $120k wages + $30k dividends</text>
  <text x="440" y="92" text-anchor="middle" class="cap">Case B — $9k wages + $40k dividends</text>
  <text x="730" y="92" text-anchor="middle" class="cap">The 2026 bands</text>

  <!-- Case A -->
  <rect x="62" y="108" width="176" height="128" fill="#9aa7b4" rx="4"/>
  <text x="150" y="176" text-anchor="middle" class="w">$120,000 ordinary</text>
  <text x="150" y="194" text-anchor="middle" class="w" style="font-weight:400;font-size:11.5px">fills the whole 0% band</text>
  <rect x="62" y="240" width="176" height="52" fill="#c9741a" rx="4"/>
  <text x="150" y="264" text-anchor="middle" class="w">$30,000 at 15%</text>
  <text x="150" y="281" text-anchor="middle" class="w" style="font-weight:400;font-size:11.5px">nothing reaches 0%</text>
  <text x="150" y="316" text-anchor="middle" class="m">Tax on the dividends: $4,500</text>

  <!-- Case B -->
  <rect x="352" y="192" width="176" height="44" fill="#9aa7b4" rx="4"/>
  <text x="440" y="219" text-anchor="middle" class="w">$9,000 ordinary</text>
  <rect x="352" y="240" width="176" height="52" fill="#149c86" rx="4"/>
  <text x="440" y="264" text-anchor="middle" class="w">$40,000 at 0%</text>
  <text x="440" y="281" text-anchor="middle" class="w" style="font-weight:400;font-size:11.5px">room left under $49,450</text>
  <text x="440" y="316" text-anchor="middle" class="m">Tax on the dividends: $0</text>

  <!-- Bands -->
  <rect x="634" y="240" width="184" height="52" fill="#149c86" rx="4"/>
  <text x="726" y="271" text-anchor="middle" class="w">0% — up to $49,450</text>
  <rect x="634" y="174" width="184" height="60" fill="#c9741a" rx="4"/>
  <text x="726" y="210" text-anchor="middle" class="w">15% — to $545,500</text>
  <rect x="634" y="108" width="184" height="60" fill="#4a63e7" rx="4"/>
  <text x="726" y="144" text-anchor="middle" class="w">20% — above that</text>
  <text x="726" y="316" text-anchor="middle" class="m">Taxable income decides the band</text>

  <rect x="62" y="336" width="756" height="28" rx="8" fill="#eaf4f8"/>
  <text x="440" y="355" text-anchor="middle" class="th">Same $40,000 of dividends, two very different bills — the difference is how much ordinary income sits underneath</text>
</svg>
