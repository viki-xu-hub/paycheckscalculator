<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d">
  <title id="t">What is and is not deducted from a Texas paycheck</title>
  <desc id="d">Texas paychecks deduct federal income tax, Social Security, Medicare and voluntary benefits, but no state or local income tax, no SDI and no employee unemployment tax.</desc>
  <style>
    .box{fill:#fff;stroke:#e4e7ec;stroke-width:1.5}
    .accent{fill:#4a63e7}
    .h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}
    .s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .n{font:700 22px Arial,Helvetica,sans-serif;fill:#1c2333}
    .v{font:700 14px Arial,Helvetica,sans-serif;fill:#1c2333}
    .w{font:700 15px Arial,Helvetica,sans-serif;fill:#fff}
    .arrow{stroke:#9aa3b2;stroke-width:2;fill:none;marker-end:url(#m)}
    .grid{stroke:#e4e7ec;stroke-width:1}
  </style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa3b2"/></marker></defs>
  <rect width="880" height="360" fill="#f7f8fa" rx="12"/>
  <text x="440" y="40" text-anchor="middle" class="h">What comes out of a Texas paycheck — and what never does</text>
  <rect x="30" y="70" width="390" height="250" rx="10" class="box"/>
  <rect x="30" y="70" width="390" height="38" rx="10" fill="#c9741a"/>
  <rect x="30" y="98" width="390" height="10" fill="#c9741a"/>
  <text x="50" y="95" class="w">Deducted from every Texas paycheck</text>
  <text x="50" y="140" class="v">●  Federal income tax</text>
  <text x="50" y="159" class="m">Set by your Form W-4 and the IRS 2026 tables</text>
  <text x="50" y="185" class="v">●  Social Security</text>
  <text x="50" y="204" class="m">6.2% of wages up to the $184,500 wage base</text>
  <text x="50" y="230" class="v">●  Medicare</text>
  <text x="50" y="249" class="m">1.45% of all wages, +0.9% above $200,000</text>
  <text x="50" y="275" class="v">●  Voluntary deductions</text>
  <text x="50" y="294" class="m">401(k), health premiums, HSA, garnishments</text>
  <rect x="460" y="70" width="390" height="250" rx="10" class="box"/>
  <rect x="460" y="70" width="390" height="38" rx="10" fill="#149c86"/>
  <rect x="460" y="98" width="390" height="10" fill="#149c86"/>
  <text x="480" y="95" class="w">Never deducted in Texas</text>
  <text x="480" y="140" class="v">○  Texas state income tax</text>
  <text x="480" y="159" class="m">Texas levies no individual income tax on wages</text>
  <text x="480" y="185" class="v">○  Local / city income tax</text>
  <text x="480" y="204" class="m">No Texas city withholds an income tax</text>
  <text x="480" y="230" class="v">○  State disability (SDI)</text>
  <text x="480" y="249" class="m">Texas runs no employee-funded SDI program</text>
  <text x="480" y="275" class="v">○  State unemployment tax</text>
  <text x="480" y="294" class="m">Paid by the employer, never deducted from pay</text>
  <text x="440" y="344" text-anchor="middle" class="m">Source: IRS Publication 15-T (2026), Social Security Administration, Texas Comptroller of Public Accounts.</text>
</svg>