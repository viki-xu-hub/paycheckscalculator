<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="t d">
  <title id="t">Texas take-home pay per paycheck by pay frequency</title>
  <desc id="d">A $60,000 Texas salary nets $969.04 weekly, $1,938.08 biweekly, $2,099.58 semimonthly and $4,199.17 monthly after taxes.</desc>
  <style>
    .box{fill:#fff;stroke:#e4e7ec;stroke-width:1.5}
    .accent{fill:#4a63e7}
    .h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}
    .s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .n{font:700 22px Arial,Helvetica,sans-serif;fill:#1c2333}
    .v{font:700 14px Arial,Helvetica,sans-serif;fill:#1c2333}
    .w{font:700 15px Arial,Helvetica,sans-serif;fill:#fff}
    .arrow{stroke:#9aa3b2;stroke-width:2;fill:none;marker-end:url(#m)}
    .grid{stroke:#e4e7ec;stroke-width:1}
  </style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa3b2"/></marker></defs>
  <rect width="880" height="360" fill="#f7f8fa" rx="12"/>
  <text x="440" y="40" text-anchor="middle" class="h">Texas take-home pay per check after taxes are deducted ($60,000, single filer)</text>
  <text x="440" y="66" text-anchor="middle" class="s">Pay frequency changes the size of each check, not the 16.0% of gross that Texas paycheck taxes take over a year.</text>
  <rect x="85" y="228.8" width="110" height="39.2" rx="4" fill="#4a63e7"/>
  <text x="140" y="218.8" text-anchor="middle" class="v">$969.04</text>
  <text x="140" y="290" text-anchor="middle" class="s">Weekly · 52 checks</text>
  <text x="140" y="310" text-anchor="middle" class="m">gross $1,153.85</text>
  <rect x="285" y="189.5" width="110" height="78.5" rx="4" fill="#4a63e7"/>
  <text x="340" y="179.5" text-anchor="middle" class="v">$1,938.08</text>
  <text x="340" y="290" text-anchor="middle" class="s">Biweekly · 26 checks</text>
  <text x="340" y="310" text-anchor="middle" class="m">gross $2,307.69</text>
  <rect x="485" y="183" width="110" height="85" rx="4" fill="#4a63e7"/>
  <text x="540" y="173" text-anchor="middle" class="v">$2,099.58</text>
  <text x="540" y="290" text-anchor="middle" class="s">Semimonthly · 24 checks</text>
  <text x="540" y="310" text-anchor="middle" class="m">gross $2,500.00</text>
  <rect x="685" y="98" width="110" height="170" rx="4" fill="#4a63e7"/>
  <text x="740" y="88" text-anchor="middle" class="v">$4,199.17</text>
  <text x="740" y="290" text-anchor="middle" class="s">Monthly · 12 checks</text>
  <text x="740" y="310" text-anchor="middle" class="m">gross $5,000.00</text>
  <line x1="60" y1="268" x2="820" y2="268" stroke="#9aa3b2" stroke-width="1.5"/>
  <text x="440" y="340" text-anchor="middle" class="m">Annual take-home $50,390 after $9,610 of federal income tax, Social Security and Medicare. No Texas state income tax.</text>
</svg>