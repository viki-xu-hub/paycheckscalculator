<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
<title id="t">State and local tax per biweekly check on $25 an hour</title>
<desc id="d">New York City $160, Oregon $153, Connecticut $150, Washington DC $115, Minnesota $114, compared with $0 in Texas.</desc>
<rect width="960" height="400" rx="16" fill="#f6f9fc"/>
