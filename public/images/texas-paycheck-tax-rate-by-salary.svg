<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
  <title id="t">Share of a Texas paycheck deducted for taxes by salary in 2026</title>
  <desc id="d">Total federal withholding plus FICA as a percentage of gross pay, single and married filers, $30,000 to $150,000.</desc>
  <style>
    .box{fill:#fff;stroke:#e4e7ec;stroke-width:1.5}
    .accent{fill:#4a63e7}
    .h{font:700 17px Arial,Helvetica,sans-serif;fill:#1c2333}
    .s{font:13px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .m{font:12px Arial,Helvetica,sans-serif;fill:#5f6b7a}
    .n{font:700 22px Arial,Helvetica,sans-serif;fill:#1c2333}
    .v{font:700 14px Arial,Helvetica,sans-serif;fill:#1c2333}
    .w{font:700 15px Arial,Helvetica,sans-serif;fill:#fff}
    .arrow{stroke:#9aa3b2;stroke-width:2;fill:none;marker-end:url(#m)}
    .grid{stroke:#e4e7ec;stroke-width:1}
  </style>
  <defs><marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9aa3b2"/></marker></defs>
  <rect width="880" height="400" fill="#f7f8fa" rx="12"/>
  <text x="440" y="40" text-anchor="middle" class="h">How much taxes deducted from paycheck Texas by salary (share of gross pay, 2026)</text>
  <text x="440" y="66" text-anchor="middle" class="s">Federal income tax + Social Security + Medicare. Texas state income tax is $0 at every income level.</text>
  <line x1="76" y1="306" x2="840" y2="306" class="grid"/>
  <text x="68" y="310" text-anchor="end" class="m">0%</text>
  <line x1="76" y1="266" x2="840" y2="266" class="grid"/>
  <text x="68" y="270" text-anchor="end" class="m">5%</text>
  <line x1="76" y1="226" x2="840" y2="226" class="grid"/>
  <text x="68" y="230" text-anchor="end" class="m">10%</text>
  <line x1="76" y1="186" x2="840" y2="186" class="grid"/>
  <text x="68" y="190" text-anchor="end" class="m">15%</text>
  <line x1="76" y1="146" x2="840" y2="146" class="grid"/>
  <text x="68" y="150" text-anchor="end" class="m">20%</text>
  <line x1="76" y1="106" x2="840" y2="106" class="grid"/>
  <text x="68" y="110" text-anchor="end" class="m">25%</text>
  <rect x="102" y="206.8" width="46" height="99.2" rx="3" fill="#4a63e7"/>
  <text x="125" y="198.8" text-anchor="middle" class="v">12.4%</text>
  <rect x="156" y="244.4" width="46" height="61.6" rx="3" fill="#149c86"/>
  <text x="179" y="236.4" text-anchor="middle" class="v">7.7%</text>
  <text x="152" y="328" text-anchor="middle" class="s">$30,000</text>
  <rect x="254" y="183.6" width="46" height="122.4" rx="3" fill="#4a63e7"/>
  <text x="277" y="175.6" text-anchor="middle" class="v">15.3%</text>
  <rect x="308" y="216.4" width="46" height="89.6" rx="3" fill="#149c86"/>
  <text x="331" y="208.4" text-anchor="middle" class="v">11.2%</text>
  <text x="304" y="328" text-anchor="middle" class="s">$50,000</text>
  <rect x="406" y="162.8" width="46" height="143.2" rx="3" fill="#4a63e7"/>
  <text x="429" y="154.8" text-anchor="middle" class="v">17.9%</text>
  <rect x="460" y="195.6" width="46" height="110.4" rx="3" fill="#149c86"/>
  <text x="483" y="187.6" text-anchor="middle" class="v">13.8%</text>
  <text x="456" y="328" text-anchor="middle" class="s">$75,000</text>
  <rect x="558" y="139.6" width="46" height="166.4" rx="3" fill="#4a63e7"/>
  <text x="581" y="131.6" text-anchor="middle" class="v">20.8%</text>
  <rect x="612" y="183.6" width="46" height="122.4" rx="3" fill="#149c86"/>
  <text x="635" y="175.6" text-anchor="middle" class="v">15.3%</text>
  <text x="608" y="328" text-anchor="middle" class="s">$100,000</text>
  <rect x="710" y="113.2" width="46" height="192.8" rx="3" fill="#4a63e7"/>
  <text x="733" y="105.2" text-anchor="middle" class="v">24.1%</text>
  <rect x="764" y="162.8" width="46" height="143.2" rx="3" fill="#149c86"/>
  <text x="787" y="154.8" text-anchor="middle" class="v">17.9%</text>
  <text x="760" y="328" text-anchor="middle" class="s">$150,000</text>
  <line x1="76" y1="306" x2="840" y2="306" stroke="#9aa3b2" stroke-width="1.5"/>
  <rect x="300" y="348" width="12" height="12" rx="3" fill="#4a63e7"/><text x="318" y="359" class="m">Single filer</text>
  <rect x="440" y="348" width="12" height="12" rx="3" fill="#149c86"/><text x="458" y="359" class="m">Married filing jointly</text>
  <text x="440" y="386" text-anchor="middle" class="m">Standard W-4, no dependents, no pre-tax deductions. Social Security stops at the $184,500 wage base.</text>
</svg>